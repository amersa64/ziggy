# Ziggy Experiment 1 - point-in-time market intelligence pipeline.
# Every value here is a modelling decision. Nothing in this file may reference
# information that would not have been available at the snapshot it is used for.

experiment:
  name: exp1_market_intelligence
  # Historical period. end_date is clamped to the last date with complete data.
  start_date: "2021-01-01"
  end_date: "2026-08-31"
  # Daily decision time. A snapshot at 20:00 ET on session D may use every piece
  # of information publicly released up to and including that instant.
  snapshot_time_local: "20:00"
  timezone: "America/New_York"
  seed: 20260913

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  artifacts: "artifacts"

http:
  # SEC requires a descriptive User-Agent with contact information.
  user_agent: "ziggy-research (amer@zaimler.ai)"
  sec_max_requests_per_second: 8.0
  generic_max_requests_per_second: 4.0
  max_retries: 5
  backoff_base_seconds: 1.5
  timeout_seconds: 45
  cache_enabled: true

sec:
  forms:
    core: ["8-K", "10-Q", "10-K", "4"]
    extended: ["SC 13D", "SC 13G", "S-3", "S-1", "424B5", "6-K", "13F-HR", "SC 13D/A", "SC 13G/A", "8-K/A", "10-K/A", "10-Q/A"]
  # EDGAR publishes acceptanceDateTime with a trailing "Z" but the wall clock is
  # US Eastern. This is validated empirically by audits/acceptance_timezone.
  acceptance_timezone: "America/New_York"
  # Structured insider-transaction datasets (Form 3/4/5), quarterly zips.
  use_form345_datasets: true
  # Primary documents for text-novelty features. This is the longest step in
  # ingestion by a wide margin (SEC fair access caps us at ~8 requests/second,
  # so the budget below is roughly an hour). The budget is spent on the largest
  # submissions first: a 400-byte 8-K has no text to be novel about. Raise it
  # for a fuller text corpus; set fetch_documents false to skip it entirely and
  # lose only the three text features.
  fetch_documents: true
  document_budget: 30000

market:
  # stooq_bulk is preferred: one archive for the whole US market, and it retains
  # history for many delisted symbols. stooq per-ticker and yahoo are fallbacks;
  # yahoo carries dividend-adjusted closes but drops delisted names entirely,
  # which is a survivorship hole the report must then declare.
  provider: "stooq_bulk"     # stooq_bulk | stooq | yahoo | csv
  fallback_providers: ["stooq", "yahoo"]
  benchmarks: ["SPY", "QQQ", "IWM"]
  vix_symbol: "^VIX"
  price_field: "adj_close"

macro:
  provider: "fred"
  # (series_id, publication lag in days, revisable)
  series:
    - {id: "DGS10", lag_days: 1, revisable: false}
    - {id: "DGS2", lag_days: 1, revisable: false}
    - {id: "T10Y2Y", lag_days: 1, revisable: false}
    - {id: "BAMLH0A0HYM2", lag_days: 1, revisable: false}
    - {id: "VIXCLS", lag_days: 1, revisable: false}
    - {id: "DTWEXBGS", lag_days: 4, revisable: false}
    - {id: "UNRATE", lag_days: 21, revisable: true}
    - {id: "CPIAUCSL", lag_days: 21, revisable: true}
    - {id: "PAYEMS", lag_days: 21, revisable: true}
    - {id: "INDPRO", lag_days: 28, revisable: true}
  vintage_cadence_days: 30

news:
  provider: "null"   # no point-in-time-trustworthy historical news feed available

universe:
  # Point-in-time tradability screen. Uses trailing market data only.
  min_price: 5.0
  min_median_dollar_volume_20d: 3000000.0
  min_history_sessions: 250
  max_staleness_sessions: 5
  max_names: 1500
  exclude_suffixes: ["W", "R", "U"]   # warrants / rights / units share classes

labels:
  horizons: [1, 5, 21]
  primary_horizon: 5
  benchmark: "SPY"
  # Entry is the open of the NEXT session after the snapshot; exit is the close
  # of session t+h. The snapshot itself is never tradable.
  entry: "next_open"
  consequential:
    primary: "cs_q90"          # cross-sectional top decile of |excess move|
    cross_sectional_quantile: 0.90
    absolute_threshold: null    # calibrated on train split only when method=abs
  secondary:
    vol_expansion_ratio: 2.0
    volume_shock_z: 3.0

splits:
  train_frac: 0.60
  validation_frac: 0.20
  holdout_frac: 0.20
  # Days between splits discarded so the longest label horizon cannot straddle
  # a split boundary.
  embargo_sessions: 21

ranking:
  top_k: [10, 20, 30, 50, 100]
  primary_k: 20
  models: ["deterministic", "logistic", "gbm"]
  walk_forward:
    enabled: true
    refit_frequency: "YS"     # refit each calendar year on strictly prior data
    min_train_sessions: 250

evaluation:
  bootstrap_samples: 2000
  block_bootstrap_length: 10
  regime_feature: "vix_level"
